<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>教師後台｜熱聲實驗室課堂系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@600&display=swap">
<link rel="stylesheet" href="/class/class.css">
</head>
<body class="wide">
<header class="top"><div class="wrap">
  <a class="mark" href="/class/admin.html">熱聲實驗室 · 課堂系統 · 教師後台</a>
  <div class="who" id="who"></div>
</div></header>

<main class="wrap">
  <section id="guest" class="hidden">
    <h1>教師後台</h1>
    <p><button class="btn" id="login">用 Google 帳號登入</button></p>
    <p class="muted">只有列為教師的帳號可以進入。</p>
  </section>

  <section id="app" class="hidden">
    <h1>實驗作業</h1>
    <div class="tabs" role="tablist">
      <button role="tab" data-course="dynamics">動力學</button>
      <button role="tab" data-course="thermodynamics">熱力學</button>
    </div>
    <div id="view"></div>
  </section>
</main>

<div id="toast" class="toast hidden" role="status"></div>

<script>
const $ = (s) => document.querySelector(s);
const TZ = 8 * 3600e3;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const toLocal = (ms) => (ms ? new Date(ms + TZ).toISOString().slice(0, 16) : "");
const fromLocal = (v) => (v ? Date.parse(`${v}:00+08:00`) : null);
const fmt = (ms) => (ms ? new Date(ms + TZ).toISOString().slice(5, 16).replace("T", " ") : "");
const PHASE = { notyet: "尚未開放", phase1: "第一階段（不及格者優先）", phase2: "第二階段（全班）", closed: "選題已截止" };
const ACTION = { login: "登入", "login-denied": "登入被拒", select: "選題", switch: "換題", cancel: "取消", "admin-assign": "教師指定", "admin-schedule": "修改時程" };

function toast(msg, err = false) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast" + (err ? " err" : "");
  clearTimeout(toast.h);
  toast.h = setTimeout(() => t.classList.add("hidden"), 3500);
}

async function api(path, body) {
  const res = await fetch("/api/class" + path, body === undefined ? {} : {
    method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.message || "發生錯誤"), { status: res.status });
  return data;
}

let course = localStorage.getItem("cls-course") || "dynamics";
let data = null;

function render() {
  const d = data;
  const active = d.roster.filter((r) => r.status === "active");
  const reg = active.filter((r) => r.topic);
  const failing = (r) => r.midterm === null || r.midterm < d.pass;
  const waiting = active.filter((r) => !r.topic && failing(r));
  const byTopic = Object.fromEntries(d.topics.map((t) => [t.id, []]));
  for (const r of d.roster) if (r.topic && byTopic[r.topic]) byTopic[r.topic].push(r);
  const topicOptions = (sel) => `<option value="">（未登記）</option>` +
    d.topics.map((t) => `<option value="${t.id}"${t.id === sel ? " selected" : ""}>${t.id} ${esc(t.title)}（${byTopic[t.id].length}/${d.capacity}）</option>`).join("");

  $("#view").innerHTML = `
    <div class="stats">
      <div class="stat"><b style="font-size:18px">${esc(PHASE[d.phase])}</b><span>目前狀態</span></div>
      <div class="stat"><b>${active.length}</b><span>在學人數（撤選 ${d.roster.length - active.length}）</span></div>
      <div class="stat"><b>${reg.length}</b><span>已登記題目</span></div>
      <div class="stat"><b>${waiting.length}</b><span>不及格／缺考但未登記</span></div>
    </div>

    <h2>時程</h2>
    <form id="sched" class="form-grid">
      <label>第一階段開放（不及格者）<input type="datetime-local" name="phase1_at" value="${toLocal(d.course.phase1_at)}"></label>
      <label>第二階段開放（全班）<input type="datetime-local" name="phase2_at" value="${toLocal(d.course.phase2_at)}"></label>
      <label>選題／換題截止<input type="datetime-local" name="select_end" value="${toLocal(d.course.select_end)}"></label>
      <label>繳交截止<input type="datetime-local" name="deadline_at" value="${toLocal(d.course.deadline_at)}"></label>
      <div><button class="btn sm" type="submit">儲存時程</button></div>
    </form>
    <p class="muted small">時間皆為台灣時間。及格標準 ${d.pass} 分（調整後期中成績），缺考視同不及格。</p>

    <h2>各題登記</h2>
    <p class="small"><a href="/api/class/admin/export.csv?course=${course}">下載 CSV（含個人化參數）</a></p>
    <div class="scroll"><table>
      <thead><tr><th>題號</th><th>題目</th><th>人數</th><th>登記者</th></tr></thead>
      <tbody>${d.topics.map((t) => `<tr>
        <td class="num">${t.id}</td><td>${esc(t.title)}</td>
        <td class="num">${byTopic[t.id].length}/${d.capacity}</td>
        <td>${byTopic[t.id].map((r) => `${esc(r.name)} <span class="muted small">${r.sid}</span>`).join("、") || '<span class="muted">—</span>'}</td>
      </tr>`).join("")}</tbody>
    </table></div>

    <h2>名單</h2>
    <p class="muted small">可直接替同學指定或移除題目（例如無法登入時）；教師指定不受名額限制。</p>
    <div class="scroll"><table>
      <thead><tr><th>學號</th><th>姓名</th><th>班級</th><th>期中</th><th>題目</th><th>指定參數</th><th>最後登入</th></tr></thead>
      <tbody>${d.roster.map((r) => `<tr class="${r.status === "active" ? "" : "withdrawn"}">
        <td class="num">${r.sid}</td><td>${esc(r.name)}</td><td class="small">${esc(r.klass)}</td>
        <td class="num">${r.midterm ?? "缺考"}</td>
        <td>${r.status === "active" ? `<select data-assign="${r.sid}">${topicOptions(r.topic)}</select>` : "撤選"}</td>
        <td class="small">${esc(r.param ?? "")}</td>
        <td class="num small">${fmt(r.last_login)}</td>
      </tr>`).join("")}</tbody>
    </table></div>

    <h2>操作紀錄</h2>
    <div class="scroll"><table>
      <thead><tr><th>時間</th><th>學號</th><th>動作</th><th>內容</th><th>操作者</th></tr></thead>
      <tbody>${d.events.map((e) => `<tr>
        <td class="num small">${fmt(e.at)}</td><td class="num small">${e.sid ?? ""}</td>
        <td>${esc(ACTION[e.action] ?? e.action)}</td><td class="small">${esc(e.detail ?? "")}</td>
        <td class="small">${esc(e.actor)}</td>
      </tr>`).join("") || '<tr><td colspan="5" class="muted">尚無紀錄</td></tr>'}</tbody>
    </table></div>`;

  $("#sched").onsubmit = async (ev) => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    const body = { course };
    for (const k of ["phase1_at", "phase2_at", "select_end", "deadline_at"]) body[k] = fromLocal(f.get(k));
    try { await api("/admin/schedule", body); toast("時程已儲存"); load(); } catch (e) { toast(e.message, true); }
  };
}

async function load() {
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.course === course));
  try {
    data = await api(`/admin/overview?course=${course}`);
  } catch (e) {
    if (e.status === 401 || e.status === 404) {
      $("#app").classList.add("hidden");
      $("#guest").classList.remove("hidden");
      return;
    }
    return toast(e.message, true);
  }
  $("#app").classList.remove("hidden");
  render();
}

document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
  course = b.dataset.course;
  localStorage.setItem("cls-course", course);
  load();
});

document.addEventListener("change", async (ev) => {
  const sel = ev.target.closest("[data-assign]");
  if (!sel) return;
  const topic = sel.value || null;
  const t = data.topics.find((x) => x.id === topic);
  const n = topic ? data.roster.filter((r) => r.topic === topic && r.sid !== sel.dataset.assign).length : 0;
  if (topic && n >= data.capacity && !confirm(`${topic} 已有 ${n} 人，仍要指定（超過名額）嗎？`)) { load(); return; }
  try {
    await api("/admin/assign", { course, sid: sel.dataset.assign, topic });
    toast(topic ? `已指定 ${topic} ${t.title}` : "已移除登記");
  } catch (e) { toast(e.message, true); }
  load();
});

$("#login").onclick = () => { location.href = "/api/class/auth/login?as=teacher&next=/class/admin.html"; };

(async () => {
  try {
    const me = await api("/me");
    if (me.role !== "teacher") { location.href = "/class/"; return; }
    $("#who").innerHTML = `${esc(me.email)}<button class="btn sm" id="logout">登出</button>`;
    $("#logout").onclick = async () => { await api("/auth/logout", {}); location.reload(); };
    load();
  } catch {
    $("#guest").classList.remove("hidden");
  }
})();
</script>
</body>
</html>
