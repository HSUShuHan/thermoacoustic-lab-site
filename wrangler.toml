# Cloudflare Workers Static Assets configuration.
# 靜態站 dist/ 照舊由 assets 服務；worker/index.mjs 只多接 /api/beacon
# （匿名訪客地區統計，寫入 Analytics Engine，見 scripts/update-visitors.mjs）。
name = "thermoacoustic-lab-site"
main = "worker/index.mjs"
compatibility_date = "2024-12-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

[[analytics_engine_datasets]]
binding = "VISITS"
dataset = "thermoacoustic_visits"

# 課堂互動系統（/class、/api/class）：實驗作業選題／繳交，之後擴充點名與快問快答。
# 名冊與成績只存在 D1，不進 repo；schema 見 migrations/。
[[d1_databases]]
binding = "CLASS_DB"
database_name = "thermoacoustic-class"
database_id = "8ffa9224-0b80-42e3-9529-b082ae58baf7"
migrations_dir = "migrations"

[vars]
TEACHER_EMAILS = "bookhsu@ntut.edu.tw"
# GOOGLE_CLIENT_ID 與 GOOGLE_CLIENT_SECRET 以 `wrangler secret put` 設定，不寫在這裡。
